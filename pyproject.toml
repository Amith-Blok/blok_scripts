[project]
name = "blok_script"
version = "0.1.0"
description = "CLI scripts for sea freight tasks"
requires-python = ">=3.11"
dependencies = [
    "curl-cffi>=0.11.1",
    "dotenv>=0.9.9",
    "folium>=0.20.0",
    "gspread>=6.2.1",
    "oauth2client>=4.1.3",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "pydantic>=2.11.5",
    "pymongo>=4.13.0",
    "seleniumbase>=4.39.1",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project.scripts]
blok = "src.main:main"

